<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Reader — คลังปกมังงะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161C24;
    --ink-deep: #0F131A;
    --paper: #EDE6D6;
    --paper-dim: #E1D8C4;
    --stamp: #B23A2E;
    --stamp-dim: #8C2E24;
    --cream-text: #EFEAE0;
    --faint: rgba(239, 234, 224, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--cream-text);
    font-family: 'IBM Plex Sans Thai', 'Noto Sans JP', sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 8%, rgba(178, 58, 46, 0.07), transparent 40%),
      radial-gradient(circle at 85% 60%, rgba(255,255,255,0.03), transparent 45%);
  }

  .site-header {
    padding: 72px 24px 56px;
    text-align: center;
    border-bottom: 1px solid rgba(239,234,224,0.12);
    position: relative;
  }

  .site-header .kanji {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    letter-spacing: 0.08em;
    margin: 0;
    color: var(--cream-text);
  }

  .site-header .kanji span {
    color: var(--stamp);
  }

  .site-header .sub {
    margin: 14px auto 0;
    max-width: 480px;
    font-size: 1.02rem;
    color: var(--faint);
    line-height: 1.7;
  }

  .site-header .count {
    margin-top: 28px;
    font-family: 'Shippori Mincho', serif;
    font-size: 0.92rem;
    color: var(--faint);
  }

  .count strong {
    color: var(--stamp);
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0 4px;
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }

  .album-section {
    margin-bottom: 56px;
  }

  .album-section:last-child {
    margin-bottom: 0;
  }

  .album-heading {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 22px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(239,234,224,0.16);
  }

  .album-heading h2 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 1.35rem;
    margin: 0;
    color: var(--cream-text);
  }

  .album-heading .album-count {
    font-size: 0.8rem;
    color: var(--faint);
  }

  .album-heading::before {
    content: '';
    width: 4px;
    height: 22px;
    background: var(--stamp);
    flex-shrink: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 28px 22px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border-radius: 3px;
    overflow: hidden;
    text-decoration: none;
    color: var(--ink-deep);
    position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,0.4), 6px 6px 0 rgba(0,0,0,0.18);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover {
    transform: translate(-2px, -4px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4), 9px 10px 0 rgba(0,0,0,0.22);
  }

  .card:hover .cover img {
    transform: scale(1.03);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 5px;
    height: 100%;
    background: var(--stamp);
    z-index: 2;
  }

  .cover {
    aspect-ratio: 2 / 3;
    background: var(--paper-dim);
    overflow: hidden;
    position: relative;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .cover .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    text-align: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 0.95rem;
    color: var(--ink-deep);
    opacity: 0.55;
  }

  .info {
    padding: 14px 16px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .info .thai-title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.35;
    margin: 0;
  }

  .info .original-title {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.78rem;
    color: rgba(22,28,36,0.62);
    margin: 0;
  }

  .info .meta {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(22,28,36,0.14);
    font-size: 0.74rem;
    color: rgba(22,28,36,0.68);
    line-height: 1.6;
  }

  .info .meta .publisher {
    font-weight: 500;
  }

  .state {
    text-align: center;
    padding: 100px 20px;
    color: var(--faint);
    font-size: 0.95rem;
  }

  .state .stamp-mark {
    display: inline-block;
    width: 34px;
    height: 34px;
    border: 2px solid var(--stamp);
    border-radius: 50%;
    margin-bottom: 18px;
    animation: spin 1.1s linear infinite;
    border-top-color: transparent;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  footer {
    text-align: center;
    padding: 36px 20px 60px;
    color: rgba(239,234,224,0.35);
    font-size: 0.78rem;
  }

  @media (max-width: 480px) {
    .site-header { padding: 56px 20px 40px; }
    main { padding: 40px 16px 80px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px 14px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1 class="kanji">Serial<span>·</span>Reader</h1>
  <p class="sub">คลังรวมปกและข้อมูลหนังสือการ์ตูนที่วางจำหน่ายแล้ว รวบรวมจากเพจ Serial Reader</p>
  <p class="count" id="count"></p>
</header>

<main>
  <div id="content" class="state">
    <span class="stamp-mark"></span><br>
    กำลังโหลดข้อมูล...
  </div>
</main>

<footer>อัปเดตอัตโนมัติจากเพจ Serial Reader ทุกชั่วโมง</footer>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzranuotJaEi-wz6fIAxC2ywwrYrOfrHc8bfbDKREoX8elJ4szf8e0pAwJ26PB4TtM9/exec';

  function parseReleaseDate(str) {
    if (!str) return null;
    const trimmed = str.trim();
    const match = trimmed.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!match) return null;
    const [, d, m, y] = match;
    const date = new Date(Number(y), Number(m) - 1, Number(d));
    return isNaN(date.getTime()) ? null : date;
  }

  function bestSortDate(item) {
    return parseReleaseDate(item.original_release_date)
      || parseReleaseDate(item.thai_release_date)
      || (item.created_time ? new Date(item.created_time) : null)
      || new Date(0);
  }

  function displayDate(item) {
    return (item.original_release_date && item.original_release_date !== '-')
      ? item.original_release_date
      : (item.thai_release_date && item.thai_release_date !== '-' ? item.thai_release_date : null);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cardHtml(item) {
    const title = item.thai_title || item.english_title || item.original_title || 'ไม่ระบุชื่อเรื่อง';
    const subTitle = item.original_title || item.english_title || '';
    const publisher = item.thai_publisher || item.original_publisher || '';
    const date = displayDate(item);
    const link = item.post_permalink || item.source_url || '#';

    const metaLine = [publisher, date].filter(Boolean).join(' · ');

    const coverInner = item.cover_image_url
      ? `<img src="${escapeHtml(item.cover_image_url)}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;fallback&quot;>${escapeHtml(title)}</div>'">`
      : `<div class="fallback">${escapeHtml(title)}</div>`;

    return `
      <a class="card" href="${escapeHtml(link)}" target="_blank" rel="noopener">
        <div class="cover">${coverInner}</div>
        <div class="info">
          <p class="thai-title">${escapeHtml(title)}</p>
          ${subTitle ? `<p class="original-title">${escapeHtml(subTitle)}</p>` : ''}
          ${metaLine ? `<div class="meta"><span class="publisher">${escapeHtml(metaLine)}</span></div>` : ''}
        </div>
      </a>
    `;
  }

  function fieldScore(item) {
    return ['thai_title','original_title','english_title','original_publisher','thai_publisher',
      'author','original_release_date','thai_release_date','quote','source_url','cover_image_url']
      .reduce((n, key) => n + (item[key] ? 1 : 0), 0);
  }

  function dedupeByTitle(items) {
    const map = new Map();
    for (const item of items) {
      const key = (item.thai_title || item.english_title || item.original_title || '').trim().toLowerCase();
      if (!key) continue;
      const existing = map.get(key);
      if (!existing || fieldScore(item) > fieldScore(existing)) {
        map.set(key, item);
      }
    }
    return Array.from(map.values());
  }

  function groupByAlbum(items) {
    const groups = new Map();
    for (const item of items) {
      const albumName = (item.album_name && item.album_name.trim()) || 'อื่นๆ';
      if (!groups.has(albumName)) groups.set(albumName, []);
      groups.get(albumName).push(item);
    }

    const sections = Array.from(groups.entries()).map(([albumName, groupItems]) => {
      groupItems.sort((a, b) => bestSortDate(b) - bestSortDate(a));
      const newestDate = bestSortDate(groupItems[0]);
      return { albumName, items: groupItems, newestDate };
    });

    sections.sort((a, b) => b.newestDate - a.newestDate);
    return sections;
  }

  function sectionHtml(section) {
    return `
      <section class="album-section">
        <div class="album-heading">
          <h2>${escapeHtml(section.albumName)}</h2>
          <span class="album-count">${section.items.length} เล่ม</span>
        </div>
        <div class="grid">
          ${section.items.map(cardHtml).join('')}
        </div>
      </section>
    `;
  }

  async function load() {
    const contentEl = document.getElementById('content');
    const countEl = document.getElementById('count');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      const items = data.filter(item => item.thai_title || item.english_title || item.original_title);
      const deduped = dedupeByTitle(items);

      if (deduped.length === 0) {
        contentEl.className = 'state';
        contentEl.innerHTML = 'ยังไม่มีข้อมูลหนังสือ';
        return;
      }

      const sections = groupByAlbum(deduped);

      countEl.innerHTML = `รวบรวมไว้แล้ว <strong>${deduped.length}</strong> เล่ม จาก <strong>${sections.length}</strong> หมวด`;
      contentEl.className = '';
      contentEl.innerHTML = sections.map(sectionHtml).join('');
    } catch (err) {
      contentEl.className = 'state';
      contentEl.innerHTML = 'โหลดข้อมูลไม่สำเร็จ กรุณาลองรีเฟรชหน้าใหม่<br><span style="font-size:0.8rem;opacity:0.7">' + escapeHtml(err.message) + '</span>';
    }
  }

  load();
</script>

</body>
</html>
